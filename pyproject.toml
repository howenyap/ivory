[project]
name = "ivory"
version = "0.1.0"
description = "Bootstrap scaffolding for the Ivory PostgreSQL cost estimation project."
readme = "README.md"
authors = [
    { name = "howenyap", email = "wenhyap02@gmail.com" }
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "polars>=1.33.1",
    "psycopg[binary]>=3.2.12",
    "sqlglot>=30.0.3",
]

[project.scripts]
ivory = "ivory:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "prek>=0.3.6",
    "pytest>=9.0.2",
    "ruff>=0.15.7",
    "ty>=0.0.24",
]

[tool.ruff]
src = ["src", "tests"]
target-version = "py314"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ty.src]
include = ["src", "tests"]
