[experiment]
tpch_scale_factors = [0.1, 1.0, 3.0]
scale_factors = [0.1, 1.0, 3.0]
query_timeout_seconds = 300
retry_count = 2
runs_per_query = 3
primary_timing_label_policy = "execution_time_ms is the canonical latency target for modeling and reporting; wall_clock_runtime_ms remains recorded for diagnostics."
seed = 20260322
modeling_grain = "successful_observation"
final_null_handling_policy = "Retain nullable source features, add explicit null indicator fields in the final modeling dataset, and exclude rows only when the observation never produced required targets."

[experiment.scale_factor_databases]
"0.1" = "tpch_sf_0_1"
"1.0" = "tpch_sf_1"
"3.0" = "tpch_sf_3"

[postgres]
version = "16"
host = "127.0.0.1"
port = 55432
user = "ivory"
password = "ivory"
admin_database = "postgres"
docker_compose_file = "docker-compose.yml"
docker_service_name = "postgres"
dbgen_service_name = "tpch-dbgen"
data_root = "artifacts/tpch-data"
dbgen_image_tag = "ivory/tpch-dbgen:phase-1a"
dbgen_repo = "https://github.com/electrum/tpch-dbgen.git"
dbgen_commit = "32f1c1b92d1664dba542e927d23d86ffa57aa253"

[postgres.scale_factor_databases]
"0.1" = "tpch_sf_0_1"
"1.0" = "tpch_sf_1"
"3.0" = "tpch_sf_3"

[experiment.split_modes]
baseline = "random_query_instance_split"
grouped = "template_grouped_holdout"

[experiment.required_metrics]
baseline = [
  "planner_total_cost",
  "execution_time_ms",
  "mae",
  "rmse",
  "mape",
  "q_error_p50",
  "q_error_p90",
  "q_error_p95",
  "q_error_p99",
  "r2",
]
grouped = [
  "planner_total_cost",
  "execution_time_ms",
  "mae",
  "rmse",
  "mape",
  "q_error_p50",
  "q_error_p90",
  "q_error_p95",
  "q_error_p99",
  "group_support",
]
